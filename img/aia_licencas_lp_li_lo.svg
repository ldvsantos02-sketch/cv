   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #6b7280" x="286.2" y="183.271336" transform="rotate(-0 286.2 183.271336)">A abrangência dos impactos define o órgão licenciador: municipal, estadual ou federal.</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #27368c" x="100.2" y="42.782762" transform="rotate(-0 100.2 42.782762)">Planejamento e concepção</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="100.2" y="83.438195" transform="rotate(-0 100.2 83.438195)">LP · Licença Prévia</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(49.77375 111.128859)">Aprova a concepção e a</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(38.773031 122.664421)">localização. Exige EIA/RIMA e</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(34.785656 134.48939)">audiência pública nos casos de</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(55.332844 145.810359)">impacto significativo.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #27368c" x="286.2" y="42.819872" transform="rotate(-0 286.2 42.819872)">Implantação (obra)</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="286.2" y="83.322531" transform="rotate(-0 286.2 83.322531)">LI · Licença de Instalação</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(239.055656 111.172499)">Autoriza a construção.</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(218.583937 122.997468)">Consolida os Programas Básicos</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(239.666625 134.318437)">Ambientais (PBA) e as</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(241.00275 145.639406)">condicionantes da LP.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #27368c" x="472.2" y="42.819872" transform="rotate(-0 472.2 42.819872)">Operação</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="472.2" y="83.386515" transform="rotate(-0 472.2 83.386515)">LO · Licença de Operação</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(416.63925 110.912624)">Autoriza o funcionamento.</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(407.165625 122.737593)">Exige monitoramento contínuo</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(425.555062 134.562562)">e renovação periódica</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(449.518031 145.883531)">da licença.</text>
   </g>
  </g>

   </g>
   <g id="text_6">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(331.998923 218.384545)">Efeitos secundários e sistêmicos: pressão</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(331.998923 230.227282)">sobre serviços urbanos, dinâmica</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(331.998923 242.263414)">econômica, bacia a jusante.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="11.234769" y="264.502434" transform="rotate(-0 11.234769 264.502434)">A delimitação muda conforme o meio analisado: a AII do meio biótico raramente coincide com a do meio socioeconômico.</text>

on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R rendering dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
          install-quarto: false

      - name: Render introductory statistics (R)
        run: quarto render aulas/introducao_estatistica/SLIDES_QUARTO --to revealjs

      - name: Generate CV PDFs
        run: |
          quarto render cv-pdf.qmd --to pdf --output cv-luiz-diego.pdf
          quarto render cv-pdf-en.qmd --to pdf --output cv-luiz-diego-en.pdf
          quarto render cv-pdf-es.qmd --to pdf --output cv-luiz-diego-es.pdf

      - name: Move PDFs to site output
        run: |
          mkdir -p _site
          cp cv-luiz-diego.pdf _site/cv-luiz-diego.pdf
          cp cv-luiz-diego-en.pdf _site/cv-luiz-diego-en.pdf
          cp cv-luiz-diego-es.pdf _site/cv-luiz-diego-es.pdf

      - name: Backup book PDFs
        run: |
          mkdir -p /tmp/book-pdfs
          for book in bioengenharia-solos ciencia-paisagem geotecnologias-sig pi branding-agro; do
            if ls books/$book/_book/*.pdf 1> /dev/null 2>&1; then
              echo "=== Backing up PDFs from $book ==="
              mkdir -p /tmp/book-pdfs/$book
              cp books/$book/_book/*.pdf /tmp/book-pdfs/$book/
            fi
          done

      - name: Render Books (HTML only)
        run: |
          for book in bioengenharia-solos ciencia-paisagem geotecnologias-sig pi branding-agro; do
            if [ -f "books/$book/_quarto.yml" ]; then
              echo "=== Rendering $book ==="
              cd books/$book
              quarto render --to html
              cd ../..
            fi
          done

      - name: Restore book PDFs
        run: |
          for book in bioengenharia-solos ciencia-paisagem geotecnologias-sig pi branding-agro; do
            if [ -d "/tmp/book-pdfs/$book" ]; then
              echo "=== Restoring PDFs to $book ==="
              cp /tmp/book-pdfs/$book/*.pdf books/$book/_book/
            fi
          done

      - name: Render Aulas (RevealJS slides)
        run: |
          # Discover the teaching projects, including SLIDES_QUARTO,
          # stand-alone Geotextiles decks, extra classes and new disciplines.
          while IFS= read -r -d '' project; do
            aulas_dir="$(dirname "$project")"
            echo "=== Rendering slides: $aulas_dir ==="
            quarto render "$aulas_dir" --to revealjs
          done < <(find aulas -name '_quarto.yml' -type f \
            -not -path '*/assets/*' -not -path '*/referencias/*' \
            -not -path 'aulas/introducao_estatistica/SLIDES_QUARTO/_quarto.yml' \
            -not -path '*/.quarto/*' -print0 | sort -z)

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2

      - name: Copy book output to site
        run: |
          for book in bioengenharia-solos ciencia-paisagem geotecnologias-sig pi branding-agro; do
            if [ -d "books/$book/_book" ]; then
              echo "=== Copying $book ==="
              mkdir -p _site/books/$book
              cp -r books/$book/_book/* _site/books/$book/
            fi
          done

      - name: Copy CNAME for custom domain
        run: cp CNAME _site/CNAME

      - name: Deduplicate published resources and check Pages size
        run: |
          python -m unittest discover -s scripts -p test_prepare_pages.py
          python scripts/prepare_pages.py _site --base-path '${{ steps.pages.outputs.base_path }}/'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

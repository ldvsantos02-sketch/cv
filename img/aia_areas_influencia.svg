   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #27368c" x="331.998923" y="120.585935" transform="rotate(-0 331.998923 120.585935)">AID - Área de Influência Direta</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(331.998923 144.253345)">Onde o impacto pode ser atribuído</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(331.998923 156.289476)">causalmente à obra: ruído, poeira,</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(331.998923 168.032526)">supressão, alteração de vazão.</text>
   </g>

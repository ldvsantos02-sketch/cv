   </g>
   <g id="text_2">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(331.998923 71.224895)">Área física ocupada pelo empreendimento:</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #0d0d0d" transform="translate(331.998923 82.750626)">canteiro, acessos, cava, barramento.</text>
   </g>

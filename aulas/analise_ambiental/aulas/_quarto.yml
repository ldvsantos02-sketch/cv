project:
  type: default
  # A publicação do site usa HTML; o mesmo QMD também pode gerar PDF com --to beamer.
  render:
    - "**/*.qmd"
lang: pt-BR
author: "Prof. Dr. Luiz Diego Vidal Santos"
academico:
  cabecalho:
    - "UNIVERSIDADE ESTADUAL DE FEIRA DE SANTANA"
    - "Componente curricular: Análise Ambiental"
    - "Semestre letivo 2026.2"
  rodape: "UEFS · Análise Ambiental"
  local: "Feira de Santana – Bahia"
format:
  revealjs:
    theme: ../../assets/academico/academico.scss
    css: ../../assets/academico/academico.css
    include-after-body:
      - ../../assets/academico/academico.html
    width: 1280
    height: 720
    transition: fade
    background-transition: none
    preview-links: auto
    slide-number: false
    controls: false
    progress: false
    center: false
    touch: true
    navigation-mode: linear
    embed-resources: true
    auto-stretch: false
    min-scale: 0.1
    max-scale: 2.0
    margin: 0
    scrollable: false
    scroll-view: false
    view-distance: 1
    mobile-view-distance: 1
    menu: false
  beamer:
    pdf-engine: xelatex
    aspectratio: 169
    classoption: [10pt, professionalfonts]
    include-in-header:
      - ../../assets/academico/beamer-academico.tex
filters:
  - ../../assets/academico/academico.lua
execute:
  echo: false

name: Publish Analise Ambiental

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Find the published site artifact
        id: base
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'publish.yml', branch: 'main',
              status: 'success', per_page: 1
            });
            const run = runs.data.workflow_runs[0];
            if (!run) throw new Error('No successful full-site publication is available.');
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: run.id
            });
            if (!artifacts.data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) {
              throw new Error('The published site artifact is unavailable. Run Quarto Publish first.');
            }
            core.setOutput('run_id', run.id);

      - name: Download the published site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ steps.base.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/base-pages

      - name: Restore the published pages
        run: |
          mkdir -p _site
          tar -xf "$RUNNER_TEMP/base-pages/artifact.tar" -C _site
          test -s _site/index.html
          test -s _site/CNAME

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render the revised book
        run: quarto render books/analise-ambiental --to html

      - name: Update the book and its PDF downloads
        run: |
          mkdir -p _site/books/analise-ambiental
          cp -a books/analise-ambiental/_book/. _site/books/analise-ambiental/
          mkdir -p _site/aulas/analise_ambiental/apostila/modulos_pdf
          cp aulas/analise_ambiental/apostila/APOSTILA_ANALISE_AMBIENTAL_CHF662_UEFS.pdf _site/aulas/analise_ambiental/apostila/
          cp aulas/analise_ambiental/apostila/modulos_pdf/*.pdf _site/aulas/analise_ambiental/apostila/modulos_pdf/
          test -s _site/books/analise-ambiental/APOSTILA_ANALISE_AMBIENTAL_CHF662_UEFS.pdf
          size=$(du -sb _site | cut -f1)
          test "$size" -lt 1000000000

      - name: Upload the updated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

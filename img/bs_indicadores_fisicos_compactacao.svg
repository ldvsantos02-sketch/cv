    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #193c60" transform="translate(544.752 215.578055)">RP com umidade registrada; porosidade,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #193c60" transform="translate(544.752 227.073993)">infiltração e distribuição das raízes.</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193c60" x="544.752" y="265.392405" transform="rotate(-0 544.752 265.392405)">Consistência: LL, LP e IP</text>
   </g>
   <g id="text_26">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #193c60" transform="translate(544.752 290.49938)">IP = LL − LP. Umidade ótima do Proctor</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #193c60" transform="translate(544.752 302.177193)">não é necessariamente umidade plástica.</text>
   </g>
  </g>
  <g id="text_27">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #193c60" x="468" y="22.605187" transform="rotate(-0 468 22.605187)">Compactação: critérios diferentes conforme a função</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #526477" x="468" y="393.984" transform="rotate(-0 468 393.984)">Curva sintética. Limiares de densidade e RP dependem do solo e das plantas; GC depende da função e da especificação.</text>
  </g>
 </g>
